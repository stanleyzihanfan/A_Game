<div class="touch-ui">
    <!-- Right half: drag to look around -->
    <div class="touch-look" data-look></div>

    <!-- Bottom-left: movement joystick -->
    <div class="touch-joy" data-joy>
        <div class="touch-joy-knob" data-knob></div>
    </div>

    <!-- Bottom-right: buttons -->
    <div class="touch-buttons">
        <div class="touch-row">
            <div class="touch-btn small" data-action="speed-down">&minus;</div>
            <div class="touch-btn small" data-action="speed-up">+</div>
        </div>
        <div class="touch-btn" data-key="Space">&#9650;</div>
        <div class="touch-btn" data-key="ShiftLeft">&#9660;</div>
    </div>
</div>
