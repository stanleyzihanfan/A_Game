<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voxel Renderer</title>
    <link rel="stylesheet" href="client/styles.css">
</head>
<body>
<div id="crosshair"></div>
<div id="info">Click to capture mouse<br>WASD: move | Space: up | Shift: down | Mouse: look | Scroll:Change Speed</div>
<div id="debug">Speed: 8</div>
<div id="errorlog"></div>

<!-- Server connect overlay: replaces window.prompt, works in any webview -->
<div id="server-connect-overlay">
    <div id="server-connect-box">
        <label for="server-url-input">Enter server API link:</label>
        <input type="text" id="server-url-input" placeholder="https://xxxx.trycloudflare.com or http://localhost:5000">
        <button id="server-url-submit">Connect</button>
        <div id="server-url-error"></div>
    </div>
</div>

<!--            JS Scripts            -->

<!--Library imports-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>
<script src="client/scripts/game_state.js"></script>
<script src="client/scripts/client_ws_registry.js"></script>
<!--Pre Initialization Script-->
<script src="client/scripts/pre_initialization.js"></script>

</body>
</html>
