<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voxel Renderer</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            width: 16px; height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255,255,255,0.8);
        }
        #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
        #crosshair::after    { height: 2px; width: 100%; top: 50%;    transform: translateY(-50%); }
        #info {
            position: fixed; top: 10px; left: 10px;
            color: white; font: 14px monospace;
            text-shadow: 1px 1px 2px black;
        }
        #debug {
            position: fixed;
            top: 10px;
            right: 10px;
            color: white;
            font: 14px monospace;
            text-shadow: 1px 1px 2px black;
        }
        #errorlog{
            position:fixed;bottom:10px;
            left:10px;color:#ff4444;
            font:12px monospace;
            text-shadow:1px 1px 2px black;
            max-width:80vw;max-height:40vh;
            overflow-y:auto;
            white-space:pre-wrap;
        }
    </style>
</head>
<body>
<div id="crosshair"></div>
<div id="info">Click to capture mouse<br>WASD: move | Space: up | Shift: down | Mouse: look | Scroll:Change Speed</div>
<div id="debug">Speed: 8</div>
<div id="errorlog"></div>
<!--Library imports-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>
<!--Error debug script-->
<script>
    window.onerror = function(msg, src, line, col, err) {
        const div = document.getElementById("errorlog");
        if (div) div.innerText += `ERROR: ${msg}\n  at ${src}:${line}:${col}\n`;
        return false;
    };
    window.onunhandledrejection = function(e) {
        const div = document.getElementById("errorlog");
        if (div) div.innerText += `UNHANDLED PROMISE: ${e.reason}\n`;
    };
</script>
<!--Game State-->
<script>
    class gameState{
        constructor (){
            //Web Socket variables
            this.socketUrl=location.href.replace(/^http/,"ws")+"server";
            this.socket= new WebSocket(this.socketUrl);
            this.socket.binaryType="arraybuffer";
            //WebSocket Dispatch Table
            this.wsDispatch={};
            //Client ID
            this.clientID=-1;
            // -- THREE.js Scene setup --------------------------------------------------------------
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(0x87ceeb);
            //scene.fog = new THREE.Fog(0x87ceeb, 20, 80);
            this.renderer = new THREE.WebGLRenderer({ antialias: true });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.shadowMap.enabled = true;
            document.body.appendChild(this.renderer.domElement);
            this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
            this.camera.position.set(5, 4, 10); // start position

            // -- Lighting -----------------------------------------------------------------
            this.sun = new THREE.DirectionalLight(0xffffff, 1.0);
            this.sun.position.set(10, 20, 10);
            this.sun.castShadow = true;
            this.scene.add(this.sun);
            this.scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // -- Grid floor ---------------------------------------------------------------
            this.scene.add(new THREE.GridHelper(40, 40, 0x444444, 0x222222));

            // -- Voxel definition ----------------------------------------------------------
            this.voxelGeo = new THREE.BoxGeometry(1, 1, 1);
            this.voxelMat = new THREE.MeshLambertMaterial({ color: 0x4a90d9 });
            this.edgeMat  = new THREE.LineBasicMaterial({ color: 0x1a3a5c });
        }
    }
</script>
<!--Web Socket initializations-->
<script>
    // -- WebSocket bootstrap -------------------------------------------------------
    // Phase 1: raw message handler before client is initialized
    // Routes init, load_mod_js, and mods_ready — then hands off to mod dispatch
    let WSConnectStartTime = -1;

    socket.onopen = () => {
        WSConnectStartTime = performance.now();
    }

    //Handler registration helper
    function registerHandler(name,func){
        if (!Object.hasOwn(wsDispatch,name)) wsDispatch[name]=[];
        else console.log(`  Frontend Handler ${name} sharing name with other functions!`);
        wsDispatch[name].push(func);
        console.log("  Frontend Handler "+name+" registered.");
    }

    // Pre-init handler — only runs until mods_ready is received
    socket.onmessage = (e) => {
        const msg = msgpack.decode(new Uint8Array(e.data));
        if (msg["op"] === "init") {
            clientID = msg["params"][0];
            initClient();
            return;
        }
        else if (msg["op"] === "load_mod_js") {
            const [modID, src] = msg["params"];
            try {
                console.log(`Loading frontend mod script: ${modID}`);
                eval(src);
                console.log(`  ${modID} loaded OK`);
            } catch(err) {
                const div = document.getElementById("errorlog");
                if (div) div.innerText += `MOD LOAD ERROR (${modID}): ${err}\n`;
            }
            return;
        }
        else if (msg["op"] === "mods_ready") {
            onModsReady();
            return;
        }else{
            console.warn("Backend attempted to access frontend handler " + msg["op"]+" before mod initialization finished with params "+msg["params"]+".");
        }
    }
</script>
<!--Web Socket Function declarations-->
<script>
    function initClient() {
        // -- Console overrides (timestamp + forward to server) --------------------
        function formatCustom(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `[${year}-${month}-${day} ${hours}:${minutes}:${seconds}]`;
        }
        const originalLog = console.log;
        console.log = function(...args) {
            const timestamp = formatCustom(new Date());
            originalLog.apply(console, [timestamp, ...args]);
            socket.send(msgpack.encode({"op": "log", "params": [timestamp, `[Client#${clientID}]`, ...args]}));
        }
        const originalWarn = console.warn;
        console.warn = function(...args) {
            const timestamp = formatCustom(new Date());
            originalWarn.apply(console, [timestamp, ...args]);
            socket.send(msgpack.encode({"op": "warn", "params": [timestamp, `[Client#${clientID}]`, ...args]}));
        }
        const originalError = console.error;
        console.error = function(...args) {
            const timestamp = formatCustom(new Date());
            originalError.apply(console, [timestamp, ...args]);
            socket.send(msgpack.encode({"op": "error", "params": [timestamp, `[Client#${clientID}]`, ...args]}));
        }
        //Error handling
        window.onerror = function(msg, src, line, col, err) {
            const div = document.getElementById("errorlog");
            if (div) div.innerText += `ERROR: ${msg}\n  at ${src}:${line}:${col}\n`;
            const timestamp = formatCustom(new Date());
            //originalError.apply(console, [timestamp, ...args]);
            socket.send(msgpack.encode({"op": "error", "params": [timestamp, `[Client#${clientID}]`, `ERROR: ${msg}\n  at ${src}:${line}:${col}\n`]}));
            return false;
        };
        window.onunhandledrejection = function(e) {
            const div = document.getElementById("errorlog");
            if (div) div.innerText += `UNHANDLED PROMISE: ${e.reason}\n`;
            //originalError.apply(console, [timestamp, ...args]);
            socket.send(msgpack.encode({"op": "error", "params": [timestamp, `[Client#${clientID}]`, `UNHANDLED PROMISE: ${e.reason}\n`]}));
        };
    }

    function onModsReady() {
        // -- Hand off WebSocket to mod dispatch table ------------------------------
        // From this point all messages are routed through wsDispatch
        // which mod client.js files have populated during load_mod_js
        socket.onmessage = (e) => {
            const msg = msgpack.decode(new Uint8Array(e.data));
            const handlers = wsDispatch[msg["op"]];
            if (handlers) {
                handlers.forEach(e => {
                    e(msg["params"]);
                });
            } else {
                console.warn("Backend attempted to access unknown frontend handler " + msg["op"]+" with params "+msg["params"]+".");
            }
        }
        // -- Start main game loop -------------------------------------------------
        socket.send(msgpack.encode({"op": "syncBlocks", "params": []}));
        main();
    }
</script>
<!--Player control & Render Loop-->
<script>
    function main(){
        // -- First-person camera controls ---------------------------------------------
        //Configs
        const keys = {};
        let yaw = 0, pitch = 0;
        let Speed = 8; // units per second
        const SCROLL_DIALATION=0.005;
        const SENSITIVITY = 0.002; // radians per pixel

        document.addEventListener("keydown", e => { keys[e.code] = true;    e.preventDefault(); });
        document.addEventListener("keyup",     e => { keys[e.code] = false; });

        // Pointer lock
        renderer.domElement.addEventListener("click", () => {
            renderer.domElement.requestPointerLock();
        });
        //Set camera look direction
        document.addEventListener("mousemove", e => {
            if (document.pointerLockElement !== renderer.domElement) return;
            yaw     -= e.movementX * SENSITIVITY;
            pitch -= e.movementY * SENSITIVITY;
            pitch    = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, pitch));
        });

        //Scroll wheel to control speed
        document.addEventListener("wheel", e => {
            Speed-=e.deltaY*SCROLL_DIALATION,0;
            Speed=Math.max(Speed,0);
            document.getElementById("debug").textContent="Speed: "+Speed
        })

        // Build a direction vector from yaw/pitch (Minecraft spectator style)
        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();
        const up = new THREE.Vector3(0, 1, 0);

        function updateCamera(dt) {
            // Rotation: yaw around world Y, pitch around local X
            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Movement directions derived from yaw only (no tilt on strafe/forward)
            forward.set(Math.sin(yaw), 0, Math.cos(yaw)).negate();
            right.crossVectors(forward, up).normalize();

            const dist = Speed * dt;
            if (keys["KeyW"]) camera.position.addScaledVector(forward, dist);
            if (keys["KeyS"]) camera.position.addScaledVector(forward, -dist);
            if (keys["KeyA"]) camera.position.addScaledVector(right, -dist);
            if (keys["KeyD"]) camera.position.addScaledVector(right, dist);
            if (keys["Space"]) camera.position.y += dist;
            if (keys["ShiftLeft"] || keys["ShiftRight"]) camera.position.y -= dist;
        }

        // -- Render+game loop ---------------------------------------------------------------
        function loop() {
            requestAnimationFrame(loop);
            const dt = 0.05; // cap at 50ms to avoid spiral
            updateCamera(dt);
            renderer.render(scene, camera);
            wsDispatch["onTick"].forEach(e => {
                e()
            });
        }
        loop();

        // -- Resize handler ------------------------------------------------------------
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }
</script>
</body>
</html>
