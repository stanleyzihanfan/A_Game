<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voxel Renderer</title>
    <link rel="stylesheet" href="client/styles.css">
</head>
<body>
<div id="crosshair"></div>
<div id="info">Click to capture mouse<br>WASD: move | Space: up | Shift: down | Mouse: look | Scroll:Change Speed</div>
<div id="debug">Speed: 8</div>
<div id="errorlog"></div>

<!-- UI mount point. Client mods register views against uiRegistry and mount
     them here by default. It sits above the renderer and below the connect
     overlay, so it is visible during gameplay but hidden behind the login. -->
<div id="ui-root"></div>

<!-- The pre-connection screen is owned by a mod (mods/connect_screen), which
     injects its overlay at runtime via client_preload_js. No hardcoded connect
     UI lives here anymore. -->

<!--            JS Scripts            -->

<!--Library imports-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>
<script src="client/scripts/game_state.js"></script>
<script src="client/scripts/client_ws_registry.js"></script>
<script src="client/scripts/ui.js"></script>
<!--Pre Initialization Script-->
<script src="client/scripts/pre_initialization.js"></script>

</body>
</html>
